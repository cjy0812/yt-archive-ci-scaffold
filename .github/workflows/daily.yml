name: 每日 YouTube 归档

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      discovery_mode:
        description: "发现模式"
        required: false
        type: choice
        default: "count"
        options:
          - count
          - time
      max_history_count:
        description: "[count模式] 每个频道回溯多少条"
        required: false
        type: string
        default: "10"
      publish_after:
        description: "[time模式] 起始日期 (YYYY-MM-DD)"
        required: false
        type: string
        default: ""
      publish_before:
        description: "[time模式] 截止日期 (YYYY-MM-DD，空=至今)"
        required: false
        type: string
        default: ""
      skip_download:
        description: "跳过下载，仅发现+决策"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: youtube-daily
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖 (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: 安装 uv 及 Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: uv sync

      - name: 发现候选视频
        env:
          DISCOVERY_MODE: ${{ github.event.inputs.discovery_mode || 'count' }}
          MAX_HISTORY_COUNT: ${{ github.event.inputs.max_history_count || '10' }}
          PUBLISH_AFTER: ${{ github.event.inputs.publish_after || '' }}
          PUBLISH_BEFORE: ${{ github.event.inputs.publish_before || '' }}
        run: uv run python scripts/discover.py

      - name: 决策预览（仅 dry-run）
        if: ${{ github.event.inputs.skip_download == 'true' }}
        run: uv run python scripts/process.py --dry-run --candidates work/candidates.jsonl

      - name: 策略决策（dry-run 预览）
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: uv run python scripts/process.py --dry-run --candidates work/candidates.jsonl

      - name: 执行下载
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: uv run python scripts/process.py --download --candidates work/candidates.jsonl
        timeout-minutes: 30

      - name: 生成字幕
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: uv run python scripts/subtitle.py --candidates work/candidates.jsonl
        timeout-minutes: 20

      - name: 提交封面、链接、字幕和状态到 Git
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbnails/ urls/ subtitles/ state/ || true
          if ! git diff --cached --quiet; then
            git commit -m "归档: 更新封面、链接、字幕和状态"
            git push
          else
            echo "[INFO] 无变更，跳过提交"
          fi

      - name: 打包媒体暂存产物
        if: ${{ github.event.inputs.skip_download != 'true' }}
        run: |
          mkdir -p staging
          if [ -d media ] && [ "$(ls -A media 2>/dev/null)" ]; then
            tar -C media -czf "staging/media-${GITHUB_RUN_ID}.tar.gz" . 2>/dev/null || echo "[WARN] tar 打包失败"
          else
            echo "[INFO] media 目录为空，跳过打包"
          fi
          if [ -f work/decisions.json ]; then
            cp work/decisions.json staging/decisions.json
          fi

      - name: 上传暂存产物
        if: ${{ github.event.inputs.skip_download != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: youtube-staging-${{ github.run_id }}
          path: staging/
          retention-days: 14
          if-no-files-found: ignore
