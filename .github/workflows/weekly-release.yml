name: Weekly YouTube release

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: youtube-weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync

      - name: Run weekly release aggregation
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/release.py
